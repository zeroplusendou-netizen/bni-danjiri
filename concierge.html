            { name: "藤原 健司", company: "Safari（サファリ）", badge: "", category: "飲食店", tag: "団体貸切（飲食店）", keywords: ["貸切", "団体", "パーティー", "宴会", "飲み会", "イベントスペース", "飲食店", "レストラン", "洋食", "ご飯", "ディナー", "食事", "居酒屋", "カフェ", "コンパ"], img: "images/fujiwara.png", intro: "大人数の宴会、歓送迎会、パーティー、イベント時にフロアを丸ごと贅沢に団体貸切できるダイニング「Safari」の藤原健司さんです！" },
            { name: "潮 瑠斗", company: "株式会社INCREASE", badge: "", category: "生活基盤", tag: "会員制サウナ", keywords: ["サウナ", "リフレッシュ", "会員制", "プライベートサウナ", "疲労回復", "ととのう", "リラックス"], img: "images/IMG_9002.JPG", intro: "プライベートな完全個室空間で日々の疲れをリフレッシュし、最高のビジネスマインドを整える会員制サウナを運営する潮瑠斗さんです！" }
        ];

        // 一般的な事業者向けの5つの質問
        const stepQuestions = [
            { 
                title: "Q1. 経営において一番解決したい問題はどれですか？", 
                desc: "お相手がもっとも関心を持っているテーマを絞り込みます。", 
                options: [
                    { text: "売上・集客（認知拡大、WEB・SNS活用）", value: "growth", icon: "fas fa-chart-line" },
                    { text: "法務・税務・インフラ（確定申告、契約、オフィス修繕）", value: "management-housing", icon: "fas fa-shield-alt" },
                    { text: "コスト削減・社内体制（通信費、人材採用、雇用）", value: "reduction", icon: "fas fa-calculator" },
                    { text: "経営者個人のサポート（健康、服装、会食・手配）", value: "creative-life", icon: "fas fa-utensils" }
                ] 
            },
            { 
                title: "Q2. 最優先で求めている『アプローチ方法』はどちらですか？", 
                desc: "解決のための現実的な手段を選択します。", 
                options: [
                    { text: "オンライン上での新規集客やプロモーション", value: "digital", icon: "fas fa-laptop" },
                    { text: "専門家によるアドバイスや規約・体制の構築", value: "advisor", icon: "fas fa-balance-scale" },
                    { text: "衣服・建築環境・食事・店舗空間などのリアルな手配", value: "physical", icon: "fas fa-store" }
                ] 
            },
            { 
                title: "Q3. お悩みの「対象ターゲット」はどちらになりますか？", 
                desc: "一般消費者向け店舗か、対法人かで分類します。", 
                options: [
                    { text: "一般消費者向けの店舗・サービス（BtoC）", value: "b2c", icon: "fas fa-user" },
                    { text: "企業・法人向けのビジネス（BtoB）", value: "b2b", icon: "fas fa-users" }
                ] 
            },
            { 
                title: "Q4. コスト面の方向性はどちらに近いですか？", 
                desc: "攻めか守りかの方向を考慮します。", 
                options: [
                    { text: "売上獲得や露出を狙う『攻めの投資』", value: "invest", icon: "fas fa-rocket" },
                    { text: "無駄の削減やトラブル回避の『守りの防衛』", value: "defense", icon: "fas fa-lock" }
                ] 
            },
            { 
                title: "Q5. 今すぐ必要なプロフェッショナルのタイプは？", 
                desc: "最終ゴールを確定させます。", 
                options: [
                    { text: "売上拡大、WEBマーケティングのプロ", value: "sales", icon: "fas fa-bullhorn" },
                    { text: "固定費や社内リスクを整理してくれるプロ", value: "costcut", icon: "fas fa-shield-alt" },
                    { text: "健康、服装、会食等で経営者を高めるプロ", value: "lifestyle", icon: "fas fa-gem" }
                ] 
            }
        ];

        let currentStepIdx = 0;
        let collectedAnswers = [];

        // ① 自由記述検索（飲食は完全ピンポイント抽出）
        function executeFreeQuery() {
            const inputField = document.getElementById('free-keyword-input');
            const rawText = inputField.value.trim();
            if (!rawText) { alert('お悩みキーワードを入力してください。'); return; }

            const query = rawText.toLowerCase();
            const foodKeywords = ["飲食店", "レストラン", "カフェ", "居酒屋", "飯", "食事", "ご飯", "ディナー", "会食", "飲み会", "宴会", "貸切", "団体"];
            const jazzKeywords = ["ジャズ", "jazz", "生演奏"];

            let resultList = [];

            if (foodKeywords.some(f => query.includes(f)) && !jazzKeywords.some(j => query.includes(j))) {
                resultList = chapterDatabase.filter(m => m.category === "飲食店");
            } else {
                resultList = chapterDatabase.filter(m => {
                    return m.keywords.some(k => query.includes(k.toLowerCase()) || k.toLowerCase().includes(query)) || 
                           m.tag.toLowerCase().includes(query) || 
                           m.category.toLowerCase().includes(query) ||
                           m.name.toLowerCase().includes(query) ||
                           m.company.toLowerCase().includes(query);
                });
            }

            displayMatchedResults(resultList, `「${rawText}」の解決に直結する専門分野を持ったメンバーを ${resultList.length} 名抽出しました。`);
        }

        // ② 質問フローの開始（確実に動くようにエレメント状態を保証）
        function activateQuestionFlow() {
            currentStepIdx = 0;
            collectedAnswers = [];
            
            const gateView = document.getElementById('panel-gate-view');
            const stepsView = document.getElementById('panel-steps-view');
            
            if (gateView && stepsView) {
                gateView.style.display = 'none';
                stepsView.style.display = 'block';
                renderCurrentQuestionStep();
            } else {
                console.error("UIエレメントが見つかりません。");
            }
        }

        function renderCurrentQuestionStep() {
            const stepData = stepQuestions[currentStepIdx];
            document.getElementById('ui-display-q-title').innerText = stepData.title;
            document.getElementById('ui-display-q-desc').innerText = stepData.desc;

            const gridContainer = document.getElementById('ui-display-q-grid');
            gridContainer.innerHTML = '';

            stepData.options.forEach(opt => {
                const choiceCard = document.createElement('div');
                choiceCard.className = 'step-choice-card';
                choiceCard.onclick = function() { registerStepSelection(opt.value); };
                choiceCard.innerHTML = `<i class="${opt.icon}"></i><h4>${opt.text}</h4>`;
                gridContainer.appendChild(choiceCard);
            });

            const fillWidth = ((currentStepIdx + 1) / stepQuestions.length) * 100;
            document.getElementById('ui-display-progress-fill').style.width = fillWidth + '%';
        }

        function registerStepSelection(value) {
            collectedAnswers.push(value);
            currentStepIdx++;

            if (currentStepIdx < stepQuestions.length) {
                renderCurrentQuestionStep();
            } else {
                calculateBestMatches();
            }
        }

        function calculateBestMatches() {
            let weights = {};
            chapterDatabase.forEach(m => weights[m.name] = 0);

            const q1 = collectedAnswers[0];
            const q2 = collectedAnswers[1];
            const q3 = collectedAnswers[2];

            chapterDatabase.forEach(m => {
                if (q1 === "growth" && ["遠藤 大輔", "平岡 広章", "瀧田 大貴"].includes(m.name)) weights[m.name] += 5;
                if (q1 === "management-housing" && ["上塩入 大樹", "二階堂 文哉", "中野 亘", "光山 隆士", "井上 理衣", "山卯 誓哉"].includes(m.name)) weights[m.name] += 5;
                if (q1 === "reduction" && ["後藤 智子", "中野 亮", "夫津木 雅也", "大森 達哉", "田北 亨子"].includes(m.name)) weights[m.name] += 5;
                if (q1 === "creative-life" && ["川﨑 景", "藤本 浩明", "土林 巧", "大森 隆之介", "三島 宏幸", "前田 耕平", "藤原 健司", "潮 瑠斗"].includes(m.name)) weights[m.name] += 5;

                if (q2 === "digital" && ["平岡 広章", "瀧田 大貴", "藤本 浩明"].includes(m.name)) weights[m.name] += 3;
                if (q2 === "advisor" && ["上塩入 大樹", "夫津木 雅也", "大森 達哉", "中野 亘", "光山 隆士", "二階堂 文哉"].includes(m.name)) weights[m.name] += 3;
                if (q2 === "physical" && ["井上 理衣", "田北 亨子", "山卯 誓哉", "川﨑 景", "土林 巧", "大森 隆之介", "三島 宏幸", "前田 耕平", "藤原 健司", "潮 瑠斗", "後藤 智子", "中野 亮", "遠藤 大輔"].includes(m.name)) weights[m.name] += 3;

                if (q3 === "b2b" && ["遠藤 大輔", "上塩入 大樹", "中野 亮", "大森 達哉", "土林 巧", "藤本 浩明", "夫津木 雅也", "中野 亘", "光山 隆士"].includes(m.name)) weights[m.name] += 2;
                if (q3 === "b2c" && ["平岡 広章", "瀧田 大貴", "後藤 智子", "井上 理衣", "田北 亨子", "山卯 誓哉", "川﨑 景", "大森 隆之介", "三島 宏幸", "前田 耕平", "藤原 健司", "潮 瑠斗", "二階堂 文哉"].includes(m.name)) weights[m.name] += 2;
            });

            let sorted = [...chapterDatabase].sort((a, b) => weights[b.name] - weights[a.name]);
            let finalSelection = sorted.slice(0, 3);

            displayMatchedResults(finalSelection, "紹介ニーズ分析に基づき、お悩みを解決できる最適なメンバーを3名抽出しました。");
        }

        function displayMatchedResults(list, summaryText) {
            document.getElementById('widget-box-root').style.display = 'none';
            document.getElementById('panel-output-view').style.display = 'block';
            document.getElementById('ui-display-result-summary').innerText = summaryText;

            const cardsContainer = document.getElementById('ui-display-cards-target');
            cardsContainer.innerHTML = '';

            if (list.length === 0) {
                list = chapterDatabase.filter(m => ["遠藤 大輔", "上塩入 大樹", "後藤 智子"].includes(m.name));
            }

            list.forEach(m => {
                const uniqueId = "copy-id-" + m.name.replace(/\s+/g, "");
                const matchedCard = document.createElement('div');
                matchedCard.className = 'member-match-card';
                matchedCard.innerHTML = `
                    <img src="${m.img}" class="member-photo" onerror="this.src='images/bni-logo.png';">
                    <div class="member-meta-info">
                        <span class="member-card-tag">${m.category} | ${m.tag}</span>
                        <h4 class="member-card-name">${m.name}</h4>
                        ${m.company ? `<p class="member-card-comp">${m.company}</p>` : ''}
                        <div class="member-text-copy-area"><span id="${uniqueId}">${m.intro}</span></div>
                        <div class="member-card-buttons">
                            <button class="action-click-btn btn-clipboard" onclick="copyIntroductions('${uniqueId}')"><i class="fas fa-copy"></i> 紹介文をコピー</button>
                            <button class="action-click-btn btn-line-forward" onclick="forwardLineLink('${m.intro}')"><i class="fab fa-line"></i> LINEで送る</button>
                        </div>
                    </div>
                `;
                cardsContainer.appendChild(matchedCard);
            });
        }

        function copyIntroductions(id) {
            const txt = document.getElementById(id).innerText;
            navigator.clipboard.writeText(txt).then(() => { alert('紹介文をコピーしました！'); });
        }

        function forwardLineLink(txt) {
            window.open("https://line.me/R/msg/text/?" + encodeURIComponent(txt), '_blank');
        }

        function restoreWidgetGate() {
            document.getElementById('panel-output-view').style.display = 'none';
            document.getElementById('panel-steps-view').style.display = 'none';
            document.getElementById('panel-gate-view').style.display = 'block';
            document.getElementById('widget-box-root').style.display = 'block';
            document.getElementById('free-keyword-input').value = '';
        }
    </script>
</body>
</html>
